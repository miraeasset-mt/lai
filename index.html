<script>

/* ===========================
   TAB
=========================== */

function switchTab(id){

    document.querySelectorAll('.tab-content').forEach(el=>{
        el.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

}

/* ===========================
   FORMAT NUMBER
=========================== */

function viNumber(n){
    return Number(n || 0).toLocaleString('vi-VN');
}

function parseNumber(str){
    return Number(String(str).replace(/[^\d]/g,'')) || 0;
}

function addMonthsKeepDay(date, months){

    const d = new Date(date);

    const day = d.getDate();

    d.setDate(1);

    d.setMonth(d.getMonth()+months);

    d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));

    return d;

}

function roundByPolicy(value){
    return Math.round(value/1000)*1000;
}

function daysBetween(d1,d2){
    return Math.round((d2-d1)/(1000*60*60*24));
}

function pmt(rate,nper,pv){

    if(rate===0) return pv/nper;

    return (rate*pv)/(1-Math.pow(1+rate,-nper));

}

/* ===========================
   CALCULATE LOAN
=========================== */

function calculateLoan(){

    const disbursalDate = new Date(document.getElementById('disbursalDate').value);

    const firstEmiDate = new Date(document.getElementById('firstEmiDate').value);

    const loanAmount = parseNumber(document.getElementById('loanAmount').value);

    const insurancePercent = Number(document.getElementById('insurancePercent').value);

    const interestRate = Number(document.getElementById('interestRate').value);

    const months = Number(document.getElementById('months').value);

    if(!loanAmount){
        alert("Vui lòng nhập số tiền vay");
        return;
    }

    const totalLoan = loanAmount * (1 + insurancePercent/100);

    const monthlyRate = interestRate / 12 / 100;

    const EMI = totalLoan * monthlyRate / (1 - Math.pow(1+monthlyRate,-months));

    document.getElementById('summary').innerHTML = `

        <div class="summary-box">
            Tổng vay + BH:
            ${viNumber(Math.round(totalLoan))}
        </div>

        <div class="summary-box">
            EMI:
            ${viNumber(Math.round(EMI+12000))}
        </div>

        <div class="summary-box">
            Số kỳ:
            ${months}
        </div>

    `;

    let balance = totalLoan;

    let html = `
    <table>

    <thead>
    <tr>
        <th>Kỳ</th>
        <th>Ngày</th>
        <th>Gốc</th>
        <th>Lãi</th>
        <th>Thanh Toán</th>
        <th>Dư Nợ</th>
    </tr>
    </thead>

    <tbody>
    `;

    let prevDate = disbursalDate;

    for(let k=1;k<=months;k++){

        let dueDate;

        if(k===1){

            dueDate = firstEmiDate;

        }else{

            dueDate = addMonthsKeepDay(firstEmiDate,k-1);

        }

        let days = daysBetween(prevDate,dueDate);

        const interest = roundByPolicy(balance * interestRate * days / 360 / 100);

        const principal = (k<months)
            ? roundByPolicy(EMI-interest)
            : balance;

        balance = Math.max(0,balance-principal);

        const fee = 12000;

        const totalPay = principal + interest + fee;

        html += `
        <tr>

            <td>${k}</td>

            <td>${dueDate.toLocaleDateString('vi-VN')}</td>

            <td>${viNumber(principal)}</td>

            <td>${viNumber(interest)}</td>

            <td>${viNumber(totalPay)}</td>

            <td>${viNumber(balance)}</td>

        </tr>
        `;

        prevDate = dueDate;

    }

    html += '</tbody></table>';

    document.getElementById('result').innerHTML = html;

}

/* ===========================
   EXPORT EXCEL
=========================== */

function exportExcel(){

    const table = document.querySelector('#result table');

    if(!table){
        alert("Không có dữ liệu");
        return;
    }

    const wb = XLSX.utils.table_to_book(table,{
        sheet:"LichTra"
    });

    XLSX.writeFile(wb,'LichTra.xlsx');

}

/* ===========================
   EXPORT PDF
=========================== */

function exportPDF(){

    const element = document.getElementById('result');

    html2pdf()
    .set({
        margin:0.3,
        filename:'LichTra.pdf',
        image:{type:'jpeg',quality:1},
        html2canvas:{scale:2},
        jsPDF:{unit:'in',format:'a4',orientation:'portrait'}
    })
    .from(element)
    .save();

}

/* ===========================
   TOPUP
=========================== */

function calculateTopup(){

    const currentEmi = parseNumber(document.getElementById('topupCurrentEmi').value);

    const annualRatePct = Number(document.getElementById('topupInterestRate').value);

    const annualRate = annualRatePct/100;

    const gracePeriod = Number(document.getElementById('topupGracePeriod').value);

    const loan = parseNumber(document.getElementById('topupLoan').value);

    const insuranceOpt = document.getElementById('topupInsuranceYesNo').value;

    const insuranceRatePct = Number(document.getElementById('topupInsuranceRate').value);

    const fee = 12000;

    const insurance = insuranceOpt === 'YES'
        ? loan*insuranceRatePct/100
        : 0;

    const totalLoan = loan + insurance;

    const graceEmi31 = totalLoan * annualRate / 365 * 31 + fee;

    const maxEmi = currentEmi + graceEmi31;

    const terms = [6,12,18,24,30,36];

    let table = `
    <table>

    <thead>
    <tr>

        <th>Kỳ Hạn</th>
        <th>EMI Ân Hạn</th>
        <th>EMI Sau Ân Hạn</th>
        <th>Số Tháng</th>
        <th>Trạng Thái</th>
        <th>Tổng Gốc Lãi</th>

    </tr>
    </thead>

    <tbody>
    `;

    terms.forEach(term=>{

        const repayMonths = term - gracePeriod;

        let emiAfterGrace = pmt(annualRate/12,repayMonths,totalLoan);

        const payAfterGrace = emiAfterGrace + fee;

        const isOk = emiAfterGrace <= maxEmi;

        table += `
        <tr>

            <td>${term}</td>

            <td>${viNumber(Math.round(graceEmi31))}</td>

            <td>${isOk ? viNumber(Math.round(payAfterGrace)) : 'N/A'}</td>

            <td>${repayMonths}</td>

            <td>${isOk ? 'OK' : 'N/A'}</td>

            <td>${isOk ? viNumber(Math.round(payAfterGrace*repayMonths)) : 'N/A'}</td>

        </tr>
        `;

    });

    table += '</tbody></table>';

    document.getElementById('topupResult').innerHTML = table;

    document.getElementById('topupSummary').innerHTML = `

        <div class="summary-box">
            LOAN:
            ${viNumber(loan)}
        </div>

        <div class="summary-box">
            INS:
            ${viNumber(Math.round(insurance))}
        </div>

        <div class="summary-box">
            Tổng tiền vay:
            ${viNumber(Math.round(totalLoan))}
        </div>

        <div class="summary-box">
            Max EMI:
            ${viNumber(Math.round(maxEmi))}
        </div>

    `;

}

/* ===========================
   RESET TOPUP
=========================== */

function resetTopup(){

    document.getElementById('topupCurrentEmi').value = '';

    document.getElementById('topupLoan').value = '';

    document.getElementById('topupResult').innerHTML = '';

    document.getElementById('topupSummary').innerHTML = '';

}

/* ===========================
   FORMAT MONEY INPUT
=========================== */

['loanAmount','topupCurrentEmi','topupLoan'].forEach(id=>{

    document.getElementById(id).addEventListener('input',function(e){

        let value = e.target.value.replace(/\D/g,'');

        if(value){

            e.target.value = Number(value).toLocaleString('vi-VN');

        }else{

            e.target.value = '';

        }

    });

});
